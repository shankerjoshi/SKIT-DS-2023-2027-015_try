name: weekly-report

on:
  schedule:
    - cron: "30 0 * * 1"      # every Monday, 06:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, otherwise the report sees one commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate weekly reports from git history
        run: python scripts/weekly_report.py --out reports/weekly

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/weekly
          if git diff --staged --quiet; then
            echo "No new commits this week — nothing to report."
          else
            git commit -m "chore(reports): weekly activity report $(date -u +%G-W%V)"
            git push
          fi
